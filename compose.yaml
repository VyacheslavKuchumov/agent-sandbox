name: agent-sandbox

# Networks: every agent type has its own internal network (no route outside,
# no NAT). The only other member of each is the vpn container.
networks:
  egress:
    name: sbx-egress
    ipam:
      config: [{ subnet: 10.88.0.0/24 }]
  coder:
    name: sbx-coder
    internal: true
    ipam:
      config: [{ subnet: 10.88.1.0/24 }]
  infra:
    name: sbx-infra
    internal: true
    ipam:
      config: [{ subnet: 10.88.2.0/24 }]
  admin:
    name: sbx-admin
    internal: true
    ipam:
      config: [{ subnet: 10.88.3.0/24 }]
  web:
    name: sbx-web
    internal: true
    ipam:
      config: [{ subnet: 10.88.5.0/24 }]
  # Monitoring stack. Not internal (Docker cannot publish ports from internal
  # networks); agents are not on it. Grafana/Loki phone-home is disabled.
  monitor:
    name: sbx-monitor
    ipam:
      config: [{ subnet: 10.88.7.0/24 }]

volumes:
  coder_home:
  infra_home:
  admin_home:
  loki_data:
  grafana_data:

secrets:
  vless_url:
    file: ./secrets/vless.url
  dashboard_secret:
    file: ./secrets/dashboard_secret
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
  host_wg:
    file: ./secrets/host-wg.json

services:
  vpn:
    build: ./vpn
    image: agent-sandbox/vpn:local
    container_name: sbx-vpn
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 1
      net.ipv4.ip_forward: 0
    tmpfs:
      - /run/sing-box:uid=1000,gid=1000,mode=0755,size=8m
      - /tmp:size=8m
    secrets: [vless_url, dashboard_secret, host_wg]
    environment:
      AGENT_INBOUNDS: coder=10.88.1.2,infra=10.88.2.2,admin=10.88.3.2,web=10.88.5.2
      WEB_ONLY_PORTS: web
      CONTROLLER: 10.88.0.2:9090
      HOST_PROXY: 10.88.0.2:7891   # host apps / browser (PAC), no kill switch
      HOST_WG_PORT: 51820          # host full tunnel via NetworkManager (10.88.0.2:51820)
    ports:
      - 127.0.0.1:9090:9090
      - 127.0.0.1:7891:7891
    networks:
      egress: { ipv4_address: 10.88.0.2 }
      coder: { ipv4_address: 10.88.1.2 }
      infra: { ipv4_address: 10.88.2.2 }
      admin: { ipv4_address: 10.88.3.2 }
      web: { ipv4_address: 10.88.5.2 }
    mem_limit: 256m
    pids_limit: 128

  # Credential broker: the only place real tokens live. One mitmproxy per agent
  # network; swaps placeholders in auth headers for allow-listed API hosts.
  keys:
    build: ./keys
    image: agent-sandbox/keys:local
    container_name: sbx-keys
    restart: unless-stopped
    depends_on: [vpn]
    read_only: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=64m
      - /home/mitmproxy:uid=1000,gid=1000,size=16m
    environment:
      SBX_CA_DIR: /run/keys/ca
    volumes:
      # rw: the broker persists refreshed codex tokens
      - ./secrets/keys:/run/keys
    networks:
      coder: { ipv4_address: 10.88.1.3 }
      infra: { ipv4_address: 10.88.2.3 }
      admin: { ipv4_address: 10.88.3.3 }
      web: { ipv4_address: 10.88.5.3 }
    mem_limit: 256m
    pids_limit: 128

  # Type 1: coding agent. Sees only ~/Projects; holds no secrets.
  coder:
    image: agent-sandbox/agent-base:local
    container_name: sbx-agent-coder
    profiles: [coder]
    restart: unless-stopped
    depends_on: [keys]
    read_only: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:exec,size=2g
    environment:
      HTTP_PROXY: http://10.88.1.3:8080
      HTTPS_PROXY: http://10.88.1.3:8080
      http_proxy: http://10.88.1.3:8080
      https_proxy: http://10.88.1.3:8080
      NO_PROXY: localhost,127.0.0.1
      no_proxy: localhost,127.0.0.1
      CLAUDE_CODE_OAUTH_TOKEN: sk-ant-oat01-sbx-placeholder
      GH_TOKEN: ghp_sbxplaceholder0000000000000000000000
      SBX_AGENT: coder
    volumes:
      - coder_home:/home/agent
      - ${PROJECTS_DIR}:${PROJECTS_DIR}
    networks:
      coder: { ipv4_address: 10.88.1.11 }
    mem_limit: 8g
    cpus: 4
    pids_limit: 4096

  # Type 5: web browsing / research. Expect prompt injection: nothing to steal,
  # nothing persists (fresh container per session), no shell, ports 80/443 only.
  web:
    image: agent-sandbox/agent-base:local
    profiles: [web]
    depends_on: [keys]
    read_only: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /home/agent:uid=1000,gid=1000,mode=0700,size=256m
      - /tmp:size=512m
    environment:
      HTTP_PROXY: http://10.88.5.3:8080
      HTTPS_PROXY: http://10.88.5.3:8080
      http_proxy: http://10.88.5.3:8080
      https_proxy: http://10.88.5.3:8080
      NO_PROXY: localhost,127.0.0.1
      no_proxy: localhost,127.0.0.1
      CLAUDE_CODE_OAUTH_TOKEN: sk-ant-oat01-sbx-placeholder
      SBX_AGENT: web
    volumes:
      - ./agents/web/managed-settings.json:/etc/claude-code/managed-settings.json:ro
      - ./web-outbox:/outbox
    working_dir: /outbox
    networks:
      web: { ipv4_address: 10.88.5.11 }
    mem_limit: 4g
    cpus: 2
    pids_limit: 512

  # Docker API for infra: GET only. (Restarts need POST=1 in socket-proxy, which
  # would also open containers/create — so restarts go through `bin/sandbox apply`.)
  dockerproxy-infra:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: sbx-dockerproxy-infra
    profiles: [infra]
    restart: unless-stopped
    environment: { CONTAINERS: 1, IMAGES: 1, INFO: 1, NETWORKS: 1, VERSION: 1, PING: 1, POST: 0 }
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      infra: { ipv4_address: 10.88.2.4 }
    mem_limit: 64m

  # Docker API for admin: GET only.
  dockerproxy-admin:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: sbx-dockerproxy-admin
    profiles: [admin]
    restart: unless-stopped
    environment: { CONTAINERS: 1, IMAGES: 1, INFO: 1, NETWORKS: 1, VERSION: 1, PING: 1, POST: 0 }
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      admin: { ipv4_address: 10.88.3.4 }
    mem_limit: 64m

  # Type 2: edits this repo (never secrets/), sees containers and their logs.
  # Changes take effect only when you run `bin/sandbox apply`.
  infra:
    image: agent-sandbox/agent-base:local
    container_name: sbx-agent-infra
    profiles: [infra]
    restart: unless-stopped
    depends_on: [keys, dockerproxy-infra]
    read_only: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:exec,size=1g
      - ${SANDBOX_DIR}/secrets:uid=1000,gid=1000,mode=0700,size=1m
    environment:
      HTTP_PROXY: http://10.88.2.3:8080
      HTTPS_PROXY: http://10.88.2.3:8080
      http_proxy: http://10.88.2.3:8080
      https_proxy: http://10.88.2.3:8080
      NO_PROXY: localhost,127.0.0.1,10.88.2.4
      no_proxy: localhost,127.0.0.1,10.88.2.4
      DOCKER_HOST: tcp://10.88.2.4:2375
      CLAUDE_CODE_OAUTH_TOKEN: sk-ant-oat01-sbx-placeholder
      GH_TOKEN: ghp_sbxplaceholder0000000000000000000000
      SBX_AGENT: infra
    volumes:
      - infra_home:/home/agent
      - ${SANDBOX_DIR}:${SANDBOX_DIR}
    working_dir: ${SANDBOX_DIR}
    networks:
      infra: { ipv4_address: 10.88.2.11 }
    mem_limit: 4g
    cpus: 2
    pids_limit: 1024

  # Type 3: sysadmin observer. Host / read-only at /host, writes only proposals/.
  admin:
    build: ./agents/admin
    image: agent-sandbox/agent-admin:local
    container_name: sbx-agent-admin
    profiles: [admin]
    restart: unless-stopped
    depends_on: [keys, dockerproxy-admin]
    read_only: true
    user: "1500:1500"
    group_add: ["${HOST_JOURNAL_GID}", "${HOST_ADM_GID}", "${HOST_USER_GID}"]
    pid: host
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=512m
    environment:
      HTTP_PROXY: http://10.88.3.3:8080
      HTTPS_PROXY: http://10.88.3.3:8080
      http_proxy: http://10.88.3.3:8080
      https_proxy: http://10.88.3.3:8080
      NO_PROXY: localhost,127.0.0.1,10.88.3.4
      no_proxy: localhost,127.0.0.1,10.88.3.4
      DOCKER_HOST: tcp://10.88.3.4:2375
      CLAUDE_CODE_OAUTH_TOKEN: sk-ant-oat01-sbx-placeholder
      SBX_AGENT: admin
    volumes:
      - admin_home:/home/admin
      - ./proposals:/proposals
      - type: bind
        source: /
        target: /host
        read_only: true
        bind:
          propagation: rslave
          recursive: readonly
    networks:
      admin: { ipv4_address: 10.88.3.11 }
    mem_limit: 2g
    cpus: 2
    pids_limit: 512

  # ---- monitoring (profile: monitor) ----
  dockerproxy-monitor:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: sbx-dockerproxy-monitor
    profiles: [monitor]
    restart: unless-stopped
    environment: { CONTAINERS: 1, EVENTS: 1, INFO: 1, VERSION: 1, PING: 1, POST: 0 }
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      monitor: { ipv4_address: 10.88.7.4 }
    mem_limit: 64m

  loki:
    image: grafana/loki:3.7.8
    container_name: sbx-loki
    profiles: [monitor]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/sandbox.yaml"]
    read_only: true
    volumes:
      - ./monitor/loki.yaml:/etc/loki/sandbox.yaml:ro
      - loki_data:/loki
    networks:
      monitor: { ipv4_address: 10.88.7.2 }
    mem_limit: 512m

  vector:
    image: timberio/vector:0.59.0-alpine
    container_name: sbx-vector
    profiles: [monitor]
    restart: unless-stopped
    depends_on: [loki, dockerproxy-monitor]
    command: ["--config", "/etc/vector/sandbox.yaml"]
    read_only: true
    tmpfs: [/var/lib/vector, /tmp]
    volumes:
      - ./monitor/vector.yaml:/etc/vector/sandbox.yaml:ro
    ports:
      - 127.0.0.1:5140:5140/udp
    networks:
      monitor: { ipv4_address: 10.88.7.5 }
    mem_limit: 256m

  grafana:
    image: grafana/grafana:13.2.3
    container_name: sbx-grafana
    profiles: [monitor]
    restart: unless-stopped
    depends_on: [loki]
    secrets: [grafana_admin_password]
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/requests.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitor/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitor/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - 127.0.0.1:3300:3000
    networks:
      monitor: { ipv4_address: 10.88.7.3 }
    mem_limit: 512m
